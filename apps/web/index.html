<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: simplified balloon-computer brand mark (assets/brand/logo-*.svg),
         a white mark on the accent badge so it stays legible at 16-32px. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233868d6'/%3E%3Cg stroke='white' stroke-width='1' stroke-linecap='round'%3E%3Cpath d='M16 9.9 L16 17.5'/%3E%3Cpath d='M10.5 12 L14 17.5'/%3E%3Cpath d='M21.5 12 L18 17.5'/%3E%3C/g%3E%3Cg fill='white'%3E%3Ccircle cx='16' cy='6.5' r='3.4'/%3E%3Ccircle cx='10.5' cy='9' r='3'/%3E%3Ccircle cx='21.5' cy='9' r='3'/%3E%3Crect x='10' y='17.5' width='12' height='7' rx='1.6'/%3E%3Crect x='14.7' y='24.5' width='2.6' height='1.5'/%3E%3Crect x='11.8' y='26' width='8.4' height='1.7' rx='0.85'/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1014" media="(prefers-color-scheme: dark)" />
    <title>notdownhub</title>
    <script>
      // Set theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem("ndh-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
